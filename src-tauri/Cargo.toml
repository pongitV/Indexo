[package]
name = "indexo"
version = "0.1.0"
description = "Indexo - Organizador semantico de arquivos e pastas"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
rayon = "1"
infer = "0.16"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
pdf-extract = "0.7"
calamine = "0.24"
docx-rs = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"
zip = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
filetime = "0.2"
trash = "5.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Foundation",
    "Foundation_Collections",
]

# Bindings para o modelo local (camada 3 do motor de classificacao).
# Habilitar quando a integracao com o LLM local for implementada (Fase 1 do plano).
# llama-cpp-2 = "0.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
